server:
  port: 8080
spring:
  datasource:
    url: jdbc:oracle:thin:@//localhost:1522/FREEPDB1
    username: pharmaDB
    password: 123456

  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      ddl-auto: validate
    show-sql: true

    properties:
      hibernate:
        format_sql: true
  flyway:
    baseline-on-migrate: true
    baseline-version: 4

springdoc:
  swagger-ui:
      path: /swagger-ui.html
  api-docs:
      enabled: true

app:
  jwt:
    secret: VGhpc0lzQVN1ZmZpY2llbnRseUxvbmdTZWNyZXRGb3JEZXZlbG9wbWVudE9ubHlLZXk=
    expiracion-minutos: ${JWT_EXPIRACION_MINUTOS:60}

logging:
  pattern:
    console: "%d %-5level [%X{requestId}] %logger{36} - %msg%n"
